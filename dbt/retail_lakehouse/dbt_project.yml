name: 'retail_lakehouse'
version: '1.0.0'
config-version: 2

profile: 'retail_lakehouse'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

models:
  retail_lakehouse:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  retail_lakehouse:
    order_items:
      +column_types:
        price: FLOAT64
    payments:
      +column_types:
        payment_value: FLOAT64
